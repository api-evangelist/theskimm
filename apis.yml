name: TheSkimm
description: 'TheSkimm is a digital media company founded in 2012 that curates news, lifestyle,
  money, career, and wellness content for a primarily female audience, delivered through
  email newsletters (the flagship Daily Skimm, plus Well Played, Skimm Well + Good, and
  Skimm Shopping), a mobile app, podcasts, and shopping guides. It is now part of Everyday
  Health, Inc., a Ziff Davis company. TheSkimm operates as a consumer media and audience
  business rather than an API provider: it publishes no public developer portal, API
  documentation, SDKs, or machine-readable API specifications. This API Evangelist profile
  was seeded as a portfolio lead of GV (Google Ventures) and enriched with the company''s
  public identity, link properties, and domain-security posture.'
